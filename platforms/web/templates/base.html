<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PC Control{% endblock %}</title>
  <style>
    :root {
      --bg: #f9f9f9;
      --text: #222;
      --border: #ddd;
      --accent: #4a6fa5;
      --success: #2e7d32;
      --warning: #ed6c02;
      --error: #d32f2f;
      --card-bg: #fff;
      --shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .nav-btn {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #eef4ff;
      border-color: var(--accent);
      color: var(--accent);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      margin: 4px;
    }
    .btn:hover { background: #3a5a80; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-outline:hover {
      background: #f0f5ff;
    }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #1b5e20; }
    .btn-warning { background: var(--warning); }
    .btn-warning:hover { background: #d84315; }
    .btn-error { background: var(--error); }
    .btn-error:hover { background: #b71c1c; }

    input, textarea, select {
      width: 100%;
      padding: 8px 12px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
    }

    code {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      word-break: break-all;
      display: block;
      margin: 4px 0;
    }

    .key-item {
      padding: 10px;
      background: #f5f5f5;
      border-left: 4px solid var(--accent);
      margin: 8px 0;
      border-radius: 0 6px 6px 0;
    }

    @media (max-width: 600px) {
      .nav-buttons { flex-direction: column; }
      .nav-btn { min-width: auto; }
      body { padding: 8px; }
      h1 { font-size: 1.5rem; }
      .btn { display: block; width: 100%; margin: 6px 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🖥️ PC Control</h1>
    <div class="nav-buttons">
      <a href="/" class="nav-btn">Главная</a>
      <a href="/monitoring" class="nav-btn">📊 Мониторинг</a>
      <a href="/network" class="nav-btn">🌐 Сеть</a>
      <a href="/control" class="nav-btn">🕹️ Управление</a>
      <a href="/docker" class="nav-btn">🐳 Docker</a>
      <a href="/systemd" class="nav-btn">⚙️ Systemd</a> <!-- Новая кнопка -->
      <a href="/vpn" class="nav-btn">🔑 VPN</a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
