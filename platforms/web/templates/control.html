<!-- platforms/web/templates/control.html -->

<div class="card">
  <h3>🖥️ Управление ПК</h3>
  <button class="btn btn-error" onclick="confirmAction('shutdown')">🔌 Выключить ПК</button>
  <button class="btn btn-warning" onclick="confirmAction('reboot')">🔄 Перезагрузить ПК</button>
  <button class="btn btn-outline" onclick="confirmAction('stop_bot')">🚫 Остановить бота</button>
  <button class="btn" onclick="confirmAction('restart_bot')">♻️ Перезапустить бота</button>
</div>

<script>
  async function confirmAction(action) {
    let msg = "";
    if (action === "shutdown") {
      msg = "Вы действительно хотите ВЫКЛЮЧИТЬ компьютер?";
    } else if (action === "reboot") {
      msg = "Вы действительно хотите ПЕРЕЗАГРУЗИТЬ компьютер?";
    } else if (action === "stop_bot") {
      msg = "Вы действительно хотите ОСТАНОВИТЬ бота?\n(После этого веб-интерфейс станет недоступен!)";
    } else if (action === "restart_bot") {
      msg = "Вы действительно хотите ПЕРЕЗАПУСТИТЬ бота?";
    }

    if (!confirm(msg)) return;

    try {
      const res = await fetch(`/api/control/${action}`, { method: "POST" });
      const data = await res.json();
      alert("✅ " + (data.message || "Выполнено"));
      // После перезапуска страница станет недоступна — это нормально
    } catch (e) {
      alert("❌ Ошибка: " + e.message);
    }
  }
</script>
