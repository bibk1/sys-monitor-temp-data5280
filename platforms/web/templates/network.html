<div id="network-data" class="card"></div>
<button class="btn" onclick="loadData()">🔄 Обновить</button>

<script>
  function renderNetwork(data) {
    let html = "";
    html += `<p><strong>📶 Wi-Fi:</strong> <code>${data.ssid}</code></p>`;
    html += `<p><strong>🏠 Локальный IP:</strong> <code>${data.local_ip}</code></p>`;
    html += `<p><strong>🔌 MAC-адрес:</strong> <code>${data.mac_address}</code></p>`;
    html += `<p><strong>🚪 Шлюз:</strong> <code>${data.gateway}</code></p>`;
    html += `<p><strong>🌍 Внешний IP:</strong> <code>${data.external_ip}</code></p>`;
    html += `<p><strong>🌐 Интернет:</strong> <span style="color: ${data.internet_status.includes('✅') ? 'green' : data.internet_status.includes('⚠️') ? 'orange' : 'red'}">${data.internet_status}</span></p>`;
    html += `<p><strong>⏱️ Пинг (8.8.8.8):</strong> <span style="color: ${data.ping.includes('❌') ? 'red' : 'green'}">${data.ping}</span></p>`;
    document.getElementById('network-data').innerHTML = html;
  }

  async function loadData() {
    try {
      const res = await fetch('/api/network/data');
      const data = await res.json();
      renderNetwork(data);
    } catch (e) {
      document.getElementById('network-data').innerHTML = `<p class="error">❌ Ошибка: ${e.message}</p>`;
    }
  }

  loadData();
</script>
