<div class="card">
  <div id="summary"></div>
  <div id="keys-list"></div>
  <div id="pagination"></div>
  <br>
  <button class="btn" onclick="startCheck()">🔄 Проверить VLESS-ключи</button>
  <div id="check-status"></div>
</div>

<script>
  let currentPage = 0;

  async function loadSummary() {
    try {
      const res = await fetch('/api/vpn/summary');
      const data = await res.json();
      let html = "<h3>🕗 Последняя проверка</h3>";
      if (data.last_run) {
        const mins = Math.floor(data.last_run.duration_sec / 60);
        const secs = Math.floor(data.last_run.duration_sec % 60);
        const duration = mins > 0 ? `${mins} мин ${secs} сек` : `${secs} сек`;
        html += `
          <p>🕒 ${data.last_run.formatted_time}</p>
          <p>• Проверено REALITY-ключей: ${data.last_run.total_reality_keys}</p>
          <p>• Доступных серверов: ${data.last_run.available_servers}</p>
          <p>• ✅ Рабочих: ${data.last_run.working_servers}</p>
          <p>• ⏱️ Время: ${duration}</p>
        `;
      } else {
        html += "<p>🕗 Нет данных о последней проверке.</p>";
      }

      if (data.top_keys.length > 0) {
        html += "<h3>🏆 Топ VLESS-серверов</h3>";
        data.top_keys.forEach(item => {
          html += `<div class="key-item"><strong>${item.label}</strong><code>${item.uri}</code></div>`;
        });
      } else {
        html += "<p>❌ Нет рабочих ключей.</p>";
      }
      document.getElementById('summary').innerHTML = html;
    } catch (e) {
      document.getElementById('summary').innerHTML = `<p class="error">❌ Ошибка: ${e.message}</p>`;
    }
  }

  async function loadKeysPage(page) {
    try {
      const res = await fetch(`/api/vpn/page/${page}`);
      const data = await res.json();
      let html = "";
      data.items.forEach(item => {
        html += `<div class="key-item"><strong>${item.label}</strong><code>${item.uri}</code></div>`;
      });
      if (!html) html = "<p>❌ Нет данных.</p>";
      document.getElementById('keys-list').innerHTML = html;

      let pg = `<button class="btn" onclick="loadKeysPage(${page - 1})" ${page === 0 ? 'disabled' : ''}>◀️ Назад</button> `;
      pg += `<span>Стр. ${page + 1}</span> `;
      pg += `<button class="btn" onclick="loadKeysPage(${page + 1})" ${!data.has_next ? 'disabled' : ''}>Вперёд ▶️</button>`;
      document.getElementById('pagination').innerHTML = pg;
      currentPage = page;
    } catch (e) {
      document.getElementById('keys-list').innerHTML = `<p class="error">❌ Ошибка: ${e.message}</p>`;
    }
  }

  async function checkStatusLoop() {
    const statusEl = document.getElementById('check-status');
    while (true) {
      try {
        const res = await fetch('/api/vpn/check/status');
        const status = await res.json();
        if (!status.running) {
          statusEl.innerHTML = status.success ? 
            '<p class="success">✅ Проверка завершена!</p>' : 
            (status.error ? `<p class="error">❌ Ошибка: ${status.error}</p>` : '');
          loadSummary();
          loadKeysPage(0);
          break;
        } else {
          statusEl.innerHTML = '<p class="warning">⏳ Проверка выполняется... (может занять несколько минут)</p>';
        }
      } catch (e) {
        statusEl.innerHTML = `<p class="error">❌ Ошибка статуса: ${e.message}</p>`;
        break;
      }
      await new Promise(r => setTimeout(r, 2000));
    }
  }

  async function startCheck() {
    if (!confirm("Запустить проверку VLESS-ключей?\nЭто может занять несколько минут.")) return;
    try {
      await fetch('/api/vpn/check/start', { method: 'POST' });
      document.getElementById('check-status').innerHTML = '<p class="info">🚀 Запуск проверки...</p>';
      checkStatusLoop();
    } catch (e) {
      document.getElementById('check-status').innerHTML = `<p class="error">❌ Ошибка: ${e.message}</p>`;
    }
  }

  loadSummary();
  loadKeysPage(0);
</script>
